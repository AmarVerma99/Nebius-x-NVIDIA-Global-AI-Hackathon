version: '3.8'

services:
  opscopilot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opscopilot-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - NEBIUS_API_KEY=${NEBIUS_API_KEY:-}
      - NEBIUS_BASE_URL=${NEBIUS_BASE_URL:-https://api.tokenfactory.nebius.com/v1}
      - NEBIUS_MODEL=${NEBIUS_MODEL:-nvidia/nemotron-3-ultra}
      - NEBIUS_REASONING_MODEL=${NEBIUS_REASONING_MODEL:-nvidia/nemotron-4-340b-instruct}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - JWT_SECRET=${JWT_SECRET:-opscopilot_jwt_super_secure_production_secret_key_32b}
      - ALLOWED_ORIGIN=*
      - SANDBOX_MODE=simulated
    volumes:
      - opscopilot-data:/app/data

volumes:
  opscopilot-data:
    driver: local
